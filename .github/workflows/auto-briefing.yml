name: Daily Auto Morning Briefing

on:
  schedule:
    # 💡 UTC 22:00 = KST 다음날 07:00
    # 월~금 평일 실행: '0 22 * * 0-4' (매일 실행하려면 '0 22 * * *' 사용)
    - cron: '40 23 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: '발행할 브리핑 종류 선택'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - stock
          - news
          - insight
 
jobs:
  publish-briefings:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 기존 20에서 22로 변경
          cache: 'npm'

      - name: 종속성 패키지 설치
        run: npm ci

      - name: Gemini 브리핑 자동 발행 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 💡 간추린 뉴스의 네이버 뉴스 API 후보 소스용 (없으면 스크립트가 자동으로 RSS만 사용하고 건너뜀)
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # 💡 SerpAPI를 실제로 쓰는 경우에만 등록 — 안 쓰면 이 줄은 지우거나 시크릿을 비워두면 됨
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node scripts/gemini-auto-publish.js ${{ github.event.inputs.category || 'all' }}